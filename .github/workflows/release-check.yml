name: Release check

# Runs the release scripts on a pull request that changes them, with a throwaway certificate, so a
# broken release is found before it reaches main. Nothing is published.
on:
  pull_request:
    paths:
      - scripts/release/**
      - .github/workflows/release.yml
      - .github/workflows/release-check.yml
      - Photon.xcodeproj/**

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Make a throwaway certificate
        run: |
          umask 077
          cat > "$RUNNER_TEMP/cert.cnf" <<'CNF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Photon Release Check
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -config "$RUNNER_TEMP/cert.cnf" \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null
          PASSWORD="$(openssl rand -hex 16)"
          openssl pkcs12 -export -legacy -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
            -out "$RUNNER_TEMP/cert.p12" -passout "pass:$PASSWORD" 2>/dev/null \
            || openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
            -out "$RUNNER_TEMP/cert.p12" -passout "pass:$PASSWORD"
          {
            echo "PHOTON_SIGNING_CERTIFICATE_P12=$(base64 < "$RUNNER_TEMP/cert.p12" | tr -d '\n')"
            echo "PHOTON_SIGNING_CERTIFICATE_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/cert.p12"

      - name: Import it
        id: signing
        run: scripts/release/import-signing-certificate.sh "$RUNNER_TEMP/check.keychain-db" >> "$GITHUB_OUTPUT"

      - name: Build, sign and pack the DMG
        run: >
          scripts/release/build-dmg.sh
          --identity "${{ steps.signing.outputs.identity }}"
          --keychain "$RUNNER_TEMP/check.keychain-db"
          --build-number "$(git rev-list --count HEAD 2>/dev/null || echo 1)"
          --output "$RUNNER_TEMP/release"

      - name: Mount the DMG and check the app
        run: |
          DMG="$(ls "$RUNNER_TEMP"/release/Photon-*.dmg)"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c "$(basename "$DMG").sha256")
          MOUNT="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null' EXIT
          test -L "$MOUNT/Applications"
          codesign --verify --strict --deep --verbose=2 "$MOUNT/Photon.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' \
            "$MOUNT/Photon.app/Contents/Info.plist"

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/check.keychain-db" 2>/dev/null || true
