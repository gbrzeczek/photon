name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The hosted image for the deployment target. Its default Xcode provides the macOS 26 SDK.
    runs-on: macos-26
    # The first run after scripts/mpv/build.sh changes builds libmpv, and later runs take it from the cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Get libmpv
        uses: ./.github/actions/libmpv

      - name: Test PhotonKit
        run: swift test --package-path Packages/PhotonKit

      - name: Build the app
        run: >
          xcodebuild build
          -project Photon.xcodeproj
          -scheme Photon
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
